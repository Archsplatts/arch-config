# keyboard
repeat_rate=15
repeat_delay=200
numlock_on=1
xkb_rules_layout=fr,us
xkb_rules_variant=oss
xkb_rules_options=grp:alt_shift_toggle

# Misc
xwayland_persistence=1
sync_obj_enable=0
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
circle_layout=tile,scroller,dwindle
enable_floating_snap=1
snap_distance=50
cursor_size=24
cursor_theme=Breeze_Light
cursor_hide_timeout=0
drag_tile_to_tile=1
single_scratchpad = 1

# Overview Setting
hotarea_size=10
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30

# Tags
tag_rule=id:1,no_hide:1
tag_rule=id:2,no_hide:1
tag_rule=id:3,no_hide:1

source=~/.config/mango/appearance.conf
source=~/.config/mango/bind.conf
source=~/.config/mango/env.conf
source=~/.config/mango/layouts.conf
source=~/.config/mango/monitor.conf
source=~/.config/mango/rule.conf

exec_once=~/.config/mango/autostart.sh
