# FAVORIS
bind=SUPER,Return,spawn,foot
bind=SUPER,e,spawn,thunar
bind=SUPER,d,spawn,rofi -show drun -config $HOME/.config/rofi/gnome-menu.rasi 
bind=SUPER,w,spawn,foot -e micro

# FENETRES & FOCUS
bind=SUPER,f,togglefullscreen
bind=SUPER,q,killclient,
bind=SUPER,space,togglefloating

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down   

bind=SUPER+Shift,Up,exchange_client,Up
bind=SUPER+Shift,Right,exchange_client,Right
bind=SUPER+Shift,Down,exchange_client,Down
bind=SUPER+Shift,Left,exchange_client,Left

# LAYOUTS
circle_layout=tile,scroller,dwindle
bind=SUPER,t,setlayout,dwindle
bind=SUPER,l,switch_layout

# PROGRAMMES
bind=SUPER,a,spawn,flatpak run com.brave.Browser https://search.brave.com/ask
bind=SUPER+Shift,p,spawn,pavucontrol
bind=SUPER+Shift,s,spawn,steam
bind=SUPER+Shift,f,spawn,foot --hold fastfetch
bind=SUPER,g,spawn,$HOME/.scripts/guitar
bind=SUPER+Shift,h,spawn,hyprpicker
bind=SUPER+Shift,c,spawn,foot -e calcurse

# ROFI
bind=SUPER+Shift,a,spawn,$HOME/.config/rofi/scripts/alarm-window
bind=SUPER,p,spawn,$HOME/.config/rofi/scripts/powermenu
bind=SUPER,s,spawn,$HOME/.config/rofi/scripts/system-menu
bind=SUPER,h,spawn,$HOME/.config/rofi/scripts/help
bind=SUPER+SHIFT,l,spawn,$HOME/.config/rofi/scripts/layouts
bind=SUPER+SHIFT,w,spawn,$HOME/.config/rofi/scripts/wallpaper-menu
bind=SUPER,v,spawn,$HOME/.config/rofi/scripts/clipboard
bind=SUPER,b,spawn,$HOME/.config/rofi/scripts/web-menu

# SYSTEM
bind=SUPER,Escape,spawn,foot -e btop
bind=SUPER,r,spawn,$HOME/.scripts/reload
bind=SUPER,u,spawn,$HOME/.scripts/update
bind=SUPER+Shift,v,spawn,foot -e sh -c "cliphist wipe && rm -r $HOME/.cache/cliphist/db"

# SPECIAL
bind=NONE,XF86HomePage,spawn,flatpak run com.brave.Browser
bind=NONE,XF86Tools,spawn,lollypop
bind=NONE,XF86Mail,spawn,thunderbird
bind=NONE,XF86Messenger,spawn,discord
bind=NONE,Print,spawn,flameshot gui
bind=NONE,XF86Calculator,spawn,galculator

# VOLUME
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

# WORKSPACES
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3

bind=SUPER+Ctrl,Left,tagtoleft
bind=SUPER+Ctrl,Right,tagtoright

# YAZI
bind=SUPER,y,spawn,foot -e yazi
bind=SUPER,i,spawn,foot -e yazi Info
bind=SUPER,m,spawn,foot -e yazi .config/mango/
bind=SUPER,c,spawn,foot -e yazi .config/
