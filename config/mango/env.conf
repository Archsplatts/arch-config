# Input Methods (méthodes de saisie)
env=GTK_IM_MODULE,fcitx
env=QT_IM_MODULE,fcitx
env=SDL_IM_MODULE,fcitx

# Qt Configuration (Utilise le thème système pour les applications Qt5)
env=QT_QPA_PLATFORMTHEME,qt5ct

# Active le scaling automatique pour les écrans haute densité
env=QT_AUTO_SCREEN_SCALE_FACTOR,1

# Force Wayland en priorité (fallback sur X11 si nécessaire)
env=QT_QPA_PLATFORM,Wayland;xcb
